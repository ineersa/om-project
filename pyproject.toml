[project]
name = "om-project"
version = "0.1.0"
description = "Private observational-memory corpus collection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema[format]>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
